<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Limpiar datos — Comidas</title>
  <style>
    body { font-family: sans-serif; display:flex; align-items:center; justify-content:center;
           min-height:100vh; margin:0; background:#f2f2f2; }
    .box { background:#fff; border-radius:8px; padding:40px 48px; text-align:center;
           box-shadow:0 2px 16px rgba(0,0,0,0.1); max-width:420px; }
    h2  { margin:0 0 12px; color:#202020; }
    p   { color:#666; font-size:14px; line-height:1.6; }
    pre { background:#f9f9f9; border:1px solid #ddd; border-radius:4px;
          padding:12px; font-size:12px; text-align:left; margin:16px 0; }
    .ok  { color:#2d7a3a; font-weight:700; font-size:18px; margin-top:16px; }
    .err { color:#C41E3A; font-weight:700; }
    a   { color:#C41E3A; font-size:13px; }
  </style>
</head>
<body>
<div class="box">
  <h2>🗑️ Limpiador de datos</h2>
  <p>Borra todas las claves <code>qm_*</code> del localStorage de esta app.</p>
  <pre id="log">Ejecutando…</pre>
  <div id="resultado"></div>
  <br>
  <a href="pivote.html">← Volver al Enlace</a>
  &nbsp;|&nbsp;
  <a href="index.html">← Ir al Inicio</a>
</div>

<script>
  const log  = document.getElementById('log');
  const res  = document.getElementById('resultado');

  try {
    const todas   = Object.keys(localStorage);
    const aBorrar = todas.filter(k => k.startsWith('qm_'));

    if (aBorrar.length === 0) {
      log.textContent = 'No había claves qm_* — ya estaba limpio.';
    } else {
      aBorrar.forEach(k => localStorage.removeItem(k));
      log.textContent = 'Claves borradas:\n' + aBorrar.map(k => '  ✓ ' + k).join('\n');
    }

    // Verificar que quedó limpio
    const restantes = Object.keys(localStorage).filter(k => k.startsWith('qm_'));
    if (restantes.length === 0) {
      res.innerHTML = '<div class="ok">✅ localStorage limpio</div>';
    } else {
      res.innerHTML = '<div class="err">⚠️ Aún quedan: ' + restantes.join(', ') + '</div>';
    }
  } catch(e) {
    log.textContent = 'Error: ' + e.message;
    res.innerHTML = '<div class="err">Verifica que estás abriendo desde el mismo origen.</div>';
  }
</script>
</body>
</html>
